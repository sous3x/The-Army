<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try Army - Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d1117;
    --surface: #161c27;
    --surface2: #1e2634;
    --line: #2a3444;
    --text: #eef1f6;
    --muted: #8b93a7;
    --accent: #ff7a45;
    --present: #35d499;
    --present-bg: #12352a;
    --absent: #ef4b62;
    --absent-bg: #3a1622;
    --unset-bg: #202a38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding:32px 16px 60px;
  }
  .wrap{max-width:1020px;margin:0 auto;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--accent);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:32px;
    letter-spacing:.01em;
    margin:0 0 20px;
    text-transform:uppercase;
  }
  .infobanner{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface2);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:16px;
    font-size:13px;
    color:var(--muted);
  }
  .banner-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--present);
    flex-shrink:0;
  }
  .syncbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .synctext{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .roster{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .roster label{font-size:13px;color:var(--muted);white-space:nowrap;}
  .roster input{
    background:var(--surface2);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    width:150px;
  }
  .roster input:focus{outline:none;border-color:var(--accent);}
  .roster button.add{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    background:var(--accent);
    color:#3a1c0c;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
  }
  .rosterlist{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-left:6px;
  }
  .rosterchip{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    background:var(--surface2);
    color:var(--text);
    padding:4px 8px;
    border-radius:5px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .rosterchip button{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:12px;
    padding:0;
    line-height:1;
  }
  .rosterchip button:hover{color:var(--absent);}
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  button.tool{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    background:var(--surface2);
    color:var(--text);
    border:1px solid var(--line);
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  button.tool:hover{border-color:var(--accent);}
  .grid-wrap{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--surface);
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
  }
  th, td{
    border:1px solid var(--line);
    padding:0;
    vertical-align:top;
  }
  th.dayhead{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--text);
    background:var(--surface2);
    padding:12px 8px;
    text-align:center;
  }
  th.timehead{
    background:var(--surface2);
    width:120px;
  }
  .slotcell{
    display:flex;
    align-items:center;
    gap:4px;
    padding:8px;
  }
  .slotcell input{
    background:transparent;
    border:none;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    width:100%;
  }
  .slotcell input:focus{outline:none;color:var(--text);}
  .rmslot{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    padding:2px 4px;
  }
  .rmslot:hover{color:var(--absent);}
  .cell{padding:6px;}
  .persons{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .persontoggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:4px 7px;
    border-radius:5px;
    background:var(--unset-bg);
    color:var(--muted);
    cursor:pointer;
    border:1px solid transparent;
    transition:background .1s ease, color .1s ease;
  }
  .persontoggle .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .persontoggle .mark{font-size:12px;flex-shrink:0;}
  .persontoggle.present{background:var(--present-bg);color:var(--present);}
  .persontoggle.absent{background:var(--absent-bg);color:var(--absent);}
  .persontoggle:hover{border-color:var(--accent);}
  .noroster{
    font-size:12px;
    color:var(--muted);
    padding:10px 4px;
  }
  .legend{
    display:flex;
    gap:18px;
    margin-top:16px;
    font-size:12px;
    color:var(--muted);
    align-items:center;
    flex-wrap:wrap;
  }
  .dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle;}
  .status{font-size:12px;color:var(--muted);margin-top:14px;font-family:'JetBrains Mono',monospace;}
  .loading{color:var(--muted);font-size:13px;padding:24px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Dispo de la semaine</p>
  <h1>Try Army</h1>

  <div class="infobanner">
    <span class="banner-dot"></span>
    <span>Ce planning est partagé en direct. Envoie ce lien à ta squad : clique sur ton nom pour cocher tes disponibilités !</span>
  </div>

  <div class="syncbar">
    <span class="synctext" id="syncText">Connexion en cours...</span>
  </div>

  <div class="roster">
    <label for="nameAdd">Ajouter quelqu'un</label>
    <input type="text" id="nameAdd" placeholder="ex: Léo" maxlength="16">
    <button class="add" id="addPersonBtn">Ajouter</button>
    <div class="rosterlist" id="rosterList"></div>
  </div>

  <div class="toolbar">
    <button class="tool" id="addSlotBtn">+ ajouter un horaire</button>
  </div>

  <div class="grid-wrap">
    <div id="gridHost" class="loading">Chargement du planning...</div>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--present)"></span>présent(e)</span>
    <span><span class="dot" style="background:var(--absent)"></span>absent(e)</span>
    <span>clique sur le nom dans une case pour changer son statut sur ce créneau</span>
  </div>

  <p class="status" id="saveStatus"></p>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Configuration Firebase associée à ton projet "The army"
  const firebaseConfig = {
    apiKey: "AIzaSyDXYbNjdosVgk_8K-1SVcqOggbR0Lszt_c",
    authDomain: "the-army-1bacf.firebaseapp.com",
    databaseURL: "https://the-army-1bacf-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "the-army-1bacf",
    storageBucket: "the-army-1bacf.firebasestorage.app",
    messagingSenderId: "1009929435422",
    appId: "1:1009929435422:web:0b0575dd78180882c7f10f",
    measurementId: "G-TT2MJ7Q8Y3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, 'planning');

  const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
  const DEFAULT_SLOTS = ["18h - 19h","19h - 20h","20h - 21h","21h - 22h","22h - 23h"];

  let state = { slots: [...DEFAULT_SLOTS], people: [], cells: {} };

  const nameAdd = document.getElementById('nameAdd');
  const addPersonBtn = document.getElementById('addPersonBtn');
  const rosterList = document.getElementById('rosterList');
  const gridHost = document.getElementById('gridHost');
  const saveStatus = document.getElementById('saveStatus');
  const addSlotBtn = document.getElementById('addSlotBtn');
  const syncText = document.getElementById('syncText');

  addPersonBtn.addEventListener('click', addPerson);
  nameAdd.addEventListener('keydown', e => { if(e.key === 'Enter') addPerson(); });

  function addPerson(){
    const val = nameAdd.value.trim();
    if(!val) return;
    if(!state.people) state.people = [];
    if(state.people.includes(val)){ nameAdd.value=''; return; }
    state.people.push(val);
    nameAdd.value = '';
    save();
  }

  function removePerson(name){
    state.people = state.people.filter(p => p !== name);
    if(state.cells){
      Object.keys(state.cells).forEach(key => {
        if(state.cells[key] && state.cells[key][name] !== undefined){
          delete state.cells[key][name];
        }
      });
    }
    save();
  }

  addSlotBtn.addEventListener('click', () => {
    if(!state.slots) state.slots = [];
    state.slots.push("Nouveau créneau");
    save();
  });

  function cellKey(day, slotIdx){ return day + "|" + slotIdx; }

  function cycleStatus(day, slotIdx, name){
    const key = cellKey(day, slotIdx);
    if(!state.cells) state.cells = {};
    if(!state.cells[key]) state.cells[key] = {};
    
    const cur = state.cells[key][name];
    if(cur === undefined){
      state.cells[key][name] = true;
    } else if(cur === true){
      state.cells[key][name] = false;
    } else {
      delete state.cells[key][name];
    }
    save();
  }

  function renameSlot(idx, value){
    state.slots[idx] = value;
    save();
  }

  function removeSlot(idx){
    state.slots.splice(idx, 1);
    const newCells = {};
    if(state.cells){
      Object.keys(state.cells).forEach(k => {
        const [day, sIdx] = k.split("|");
        const n = parseInt(sIdx, 10);
        if(n === idx) return;
        const newIdx = n > idx ? n - 1 : n;
        newCells[cellKey(day, newIdx)] = state.cells[k];
      });
    }
    state.cells = newCells;
    save();
  }

  function renderRoster(){
    if(!state.people || state.people.length === 0){
      rosterList.innerHTML = '';
      return;
    }
    rosterList.innerHTML = state.people.map(p =>
      `<span class="rosterchip">${escapeHtml(p)}<button data-removeperson="${escapeAttr(p)}" title="retirer">×</button></span>`
    ).join('');
    rosterList.querySelectorAll('[data-removeperson]').forEach(btn => {
      btn.addEventListener('click', () => removePerson(btn.dataset.removeperson));
    });
  }

  function render(){
    renderRoster();

    let html = '<table><thead><tr><th class="timehead"></th>';
    DAYS.forEach(d => { html += `<th class="dayhead">${escapeHtml(d)}</th>`; });
    html += '</tr></thead><tbody>';

    (state.slots || []).forEach((slot, idx) => {
      html += '<tr>';
      html += `<td>
        <div class="slotcell">
          <input type="text" value="${escapeAttr(slot)}" data-slotidx="${idx}" class="slotInput">
          <button class="rmslot" data-rmidx="${idx}" title="supprimer ce créneau">×</button>
        </div>
      </td>`;
      DAYS.forEach(day => {
        const key = cellKey(day, idx);
        const entry = (state.cells && state.cells[key]) ? state.cells[key] : {};
        if(!state.people || state.people.length === 0){
          html += `<td class="cell"><div class="noroster">ajoute des personnes ↑</div></td>`;
        } else {
          let persons = '';
          state.people.forEach(name => {
            const st = entry[name];
            const cls = st === true ? 'present' : (st === false ? 'absent' : '');
            const mark = st === true ? '✓' : (st === false ? '✕' : '·');
            persons += `<div class="persontoggle ${cls}" data-day="${escapeAttr(day)}" data-slotidx="${idx}" data-person="${escapeAttr(name)}">
              <span class="name">${escapeHtml(name)}</span><span class="mark">${mark}</span>
            </div>`;
          });
          html += `<td class="cell"><div class="persons">${persons}</div></td>`;
        }
      });
      html += '</tr>';
    });

    html += '</tbody></table>';
    gridHost.innerHTML = html;
    gridHost.classList.remove('loading');

    gridHost.querySelectorAll('.persontoggle').forEach(el => {
      el.addEventListener('click', () => {
        cycleStatus(el.dataset.day, parseInt(el.dataset.slotidx, 10), el.dataset.person);
      });
    });
    gridHost.querySelectorAll('.slotInput').forEach(inp => {
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('change', () => {
        renameSlot(parseInt(inp.dataset.slotidx, 10), inp.value);
      });
    });
    gridHost.querySelectorAll('.rmslot').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        removeSlot(parseInt(btn.dataset.rmidx, 10));
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  function save(){
    saveStatus.textContent = 'Sauvegarde...';
    set(dbRef, state).then(() => {
      saveStatus.textContent = 'Enregistré en direct !';
    }).catch(err => {
      saveStatus.textContent = 'Erreur de sauvegarde: ' + err.message;
    });
  }

  function formatTime(){
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
  }

  // Écoute les changements en temps réel via Firebase
  onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    if(data){
      state = data;
      if(!state.people) state.people = [];
      if(!state.slots) state.slots = [...DEFAULT_SLOTS];
      if(!state.cells) state.cells = {};
    }
    render();
    syncText.textContent = 'Connecté · Synchro ' + formatTime();
  });
</script>
</body>
</html>
